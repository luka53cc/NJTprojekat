<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Nastavnici</h3>
  <!-- Prikazuje se samo administratoru -->
  <a *ngIf="authService.isLoggedIn()" routerLink="/nastavnici/novi" class="btn btn-primary">+ Novi nastavnik</a>
</div>

<div class="alert alert-danger" *ngIf="greska">{{ greska }}</div>

<div class="text-center" *ngIf="ucitavanje">
  <div class="spinner-border"></div>
</div>

<table class="table table-striped table-hover" *ngIf="!ucitavanje">
  <thead>
    <tr>
      <th>Ime i prezime</th>
      <th>Email</th>
      <th>Zvanje</th>
      <th style="width: 160px;">Akcije</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let n of nastavnici">
      <td>{{ n.ime }} {{ n.prezime }}</td>
      <td>{{ n.email }}</td>
      <td>{{ n.zvanje }}</td>
      <td>
        <!-- Prikazuje se SAMO administratoru -->
        <ng-container *ngIf="authService.isLoggedIn()">
          <a [routerLink]="['/nastavnici', n.id]" class="btn btn-sm btn-outline-secondary me-1">Izmeni</a>
          <button class="btn btn-sm btn-outline-danger" (click)="obrisi(n.id)">Obriši</button>
        </ng-container>
        <!-- Ako je gost, tabela nema kolonu za akcije ili ostaje prazna -->
        <span *ngIf="!authService.isLoggedIn()" class="text-muted small">Samo pregled</span>
      </td>
    </tr>
    <tr *ngIf="nastavnici.length === 0">
      <td colspan="4" class="text-center text-muted">Nema unetih nastavnika</td>
    </tr>
  </tbody>
</table>
