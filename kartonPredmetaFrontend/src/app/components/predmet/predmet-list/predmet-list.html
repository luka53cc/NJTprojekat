<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Predmeti</h3>
  <a routerLink="/predmeti/novi" class="btn btn-primary">+ Novi predmet</a>
</div>

<div class="card mb-3">
  <div class="card-body">
    <div class="row g-2">
      <div class="col-md-3">
        <input type="text" class="form-control" placeholder="Naziv" [(ngModel)]="naziv" />
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control" placeholder="Šifra" [(ngModel)]="sifra" />
      </div>
      <div class="col-md-1">
        <input type="number" class="form-control" placeholder="Godina" [(ngModel)]="godinaStudija" min="1" max="4" />
      </div>
      <div class="col-md-1">
        <input type="number" class="form-control" placeholder="Sem." [(ngModel)]="semestar" min="1" max="8" />
      </div>
      <div class="col-md-2">
        <select class="form-select" [(ngModel)]="status">
          <option [value]="undefined">-- Status --</option>
          <option *ngFor="let s of statusi" [value]="s">{{ s }}</option>
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select" [(ngModel)]="studijskiProgramId">
          <option [value]="undefined">-- Studijski program --</option>
          <option *ngFor="let sp of studijskiProgrami" [value]="sp.id">{{ sp.skracenica }}</option>
        </select>
      </div>
    </div>
    <div class="mt-2">
      <button class="btn btn-primary btn-sm" (click)="primeniFiltere()">Pretraži</button>
      <button class="btn btn-outline-secondary btn-sm ms-2" (click)="ocistiFiltere()">Očisti filtere</button>
    </div>
  </div>
</div>

<div class="alert alert-danger" *ngIf="greska">{{ greska }}</div>

<div class="text-center" *ngIf="ucitavanje">
  <div class="spinner-border"></div>
</div>

<table class="table table-striped table-hover" *ngIf="!ucitavanje">
  <thead>
    <tr>
      <th>Šifra</th>
      <th>Naziv</th>
      <th>Godina</th>
      <th>Semestar</th>
      <th>ESPB</th>
      <th>Status</th>
      <th style="width: 220px;">Akcije</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of predmeti">
      <td>{{ p.sifra }}</td>
      <td>{{ p.naziv }}</td>
      <td>{{ p.godinaStudija }}</td>
      <td>{{ p.semestar }}</td>
      <td>{{ p.espb }}</td>
      <td>{{ p.status }}</td>
      <td>
        <a [routerLink]="['/predmeti/detalji', p.id]" class="btn btn-sm btn-outline-primary me-1">Detalji</a>
        <a [routerLink]="['/predmeti', p.id]" class="btn btn-sm btn-outline-secondary me-1">Izmeni</a>
        <button class="btn btn-sm btn-outline-success me-1" (click)="preuzmiPdf(p.id, p.sifra)">PDF</button>
        <button class="btn btn-sm btn-outline-danger" (click)="obrisi(p.id)">Obriši</button>
      </td>
    </tr>
    <tr *ngIf="predmeti.length === 0">
      <td colspan="7" class="text-center text-muted">Nema pronađenih predmeta</td>
    </tr>
  </tbody>
</table>

<nav *ngIf="!ucitavanje && ukupnoStranica > 1">
  <ul class="pagination justify-content-center">
    <li class="page-item" [class.disabled]="trenutnaStranica === 0">
      <button class="page-link" (click)="idiNaStranicu(trenutnaStranica - 1)">Prethodna</button>
    </li>
    <li class="page-item" *ngFor="let s of brojeviStranica()" [class.active]="s === trenutnaStranica">
      <button class="page-link" (click)="idiNaStranicu(s)">{{ s + 1 }}</button>
    </li>
    <li class="page-item" [class.disabled]="trenutnaStranica === ukupnoStranica - 1">
      <button class="page-link" (click)="idiNaStranicu(trenutnaStranica + 1)">Sledeća</button>
    </li>
  </ul>
  <p class="text-center text-muted">Ukupno: {{ ukupnoElemenata }} predmeta</p>
</nav>
